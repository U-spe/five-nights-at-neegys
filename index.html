<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no"
    >

    <meta
        name="description"
        content="5 Nights at Neegys, a browser survival horror game."
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>5 Nights at Neegys</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="gameShell">

        <canvas
            id="sceneCanvas"
            width="1280"
            height="720"
            aria-label="5 Nights at Neegys game"
        ></canvas>

        <canvas
            id="uiCanvas"
            width="1280"
            height="720"
        ></canvas>

    </div>


    <div
        id="audioPermission"
        class="game-dialog hidden"
    >
        <section>
            <h1>Sound Permission</h1>

            <p>
                Tap below to enable game audio.
            </p>

            <button id="allowAudioButton">
                ENABLE AUDIO
            </button>
        </section>
    </div>


    <div
        id="fullscreenDialog"
        class="game-dialog hidden"
    >
        <section>
            <h1>Fullscreen Paused</h1>

            <p>
                Return to fullscreen mode?
            </p>

            <button id="enterFullscreenButton">
                ENTER FULLSCREEN
            </button>

            <button
                id="closeFullscreenButton"
                class="secondary"
            >
                CANCEL
            </button>
        </section>
    </div>


    <noscript>
        JavaScript is required to play 5 Nights at Neegys.
    </noscript>


    <script
        type="module"
        src="js/game.js"
    ></script>

</body>
</html>
