<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020403">

  <title>5 Nights at Neegys</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"
  >

  <!-- The CSS is inside the css folder. -->
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>

<body>
  <main id="gameShell" aria-label="5 Nights at Neegys game">
    <canvas
      id="sceneCanvas"
      width="1280"
      height="720"
    ></canvas>

    <div id="cameraNoise" aria-hidden="true"></div>
    <div id="scanlines" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>

    <section id="hud" class="hidden" aria-live="polite">
      <div id="clockHud">
        <strong id="hourLabel">12 AM</strong>
        <span id="nightLabel">NIGHT 1</span>
      </div>

      <div id="powerHud">
        <span>
          POWER LEFT:
          <strong id="powerLabel">100%</strong>
        </span>

        <div id="powerMeter">
          <i id="powerFill"></i>
        </div>

        <span>USAGE:</span>

        <div id="usageBars" aria-label="Power usage">
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </div>
      </div>
    </section>

    <section id="officeControls" class="hidden">
      <div class="door-panel left-panel">
        <button
          id="leftDoorButton"
          class="door-button"
          type="button"
        >
          DOOR
        </button>

        <button
          id="leftLightButton"
          class="light-button"
          type="button"
        >
          LIGHT
        </button>
      </div>

      <div class="door-panel right-panel">
        <button
          id="rightDoorButton"
          class="door-button"
          type="button"
        >
          DOOR
        </button>

        <button
          id="rightLightButton"
          class="light-button"
          type="button"
        >
          LIGHT
        </button>
      </div>
    </section>

    <section
      id="cameraInterface"
      class="hidden"
      aria-label="Security camera monitor"
    >
      <div id="cameraHeading">
        <strong id="cameraCode">CAM 1A</strong>
        <span id="cameraName">BANK SAFE</span>
        <span id="recordingDot">● REC</span>
      </div>

      <div id="cameraMap" aria-label="Camera map">
        <div class="map-title">CAMERA NETWORK</div>
        <div class="map-office">YOU</div>
      </div>

      <div id="cameraHelp">
        SELECT CAMERA · ← →
      </div>
    </section>

    <button
      id="monitorButton"
      class="hidden"
      type="button"
    >
      <span id="monitorButtonText">
        OPEN CAMERAS
      </span>
    </button>

    <div
      id="message"
      class="hidden"
      aria-live="assertive"
    ></div>

    <!-- Restored old-style menu -->
    <section id="titleScreen" class="screen-card">
      <div class="title-grid" aria-hidden="true"></div>

      <div class="title-copy">
        <h1>
          <span>5 NIGHTS</span>
          <small>AT</small>
          <b>NEEGYS</b>
        </h1>

        <p class="eyebrow">
          NEEGY NATIONAL BANK
        </p>

        <nav id="titleMenu" aria-label="Main menu">
          <button
            id="startButton"
            class="menu-item active"
            data-menu-index="0"
            type="button"
          >
            <span>NEW GAME</span>
            <small>NIGHT 1</small>
          </button>

          <button
            id="continueButton"
            class="menu-item"
            data-menu-index="1"
            type="button"
          >
            <span>CONTINUE</span>
            <small id="continueNight">NIGHT 1</small>
          </button>

          <button
            id="customNightButton"
            class="menu-item"
            data-menu-index="2"
            type="button"
          >
            <span>CUSTOM NIGHT</span>
            <small>20 / 20</small>
          </button>
        </nav>
      </div>

      <div class="bank-seal" aria-hidden="true">
        <div class="seal-ring">
          <b>N</b>
        </div>

        <span>SECURITY SYSTEM</span>
      </div>

      <div class="title-footer">
        <span>
          ↑ ↓ SELECT · ENTER CONFIRM · F FULLSCREEN
        </span>

        <span>
          v0.3 THREE.JS BUILD
        </span>
      </div>
    </section>

    <section id="nightIntro" class="screen-card hidden">
      <p id="introNight">NIGHT 1</p>
      <strong>12:00 AM</strong>
    </section>

    <section id="resultScreen" class="screen-card hidden">
      <h2 id="resultTitle">6 AM</h2>
      <p id="resultText">SHIFT COMPLETE</p>

      <button id="restartButton" type="button">
        PLAY AGAIN
      </button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="js/security-cameras.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
